  <!-- L5 图脚：图例 + 比例尺 -->
  <g id="legend" font-family="PT Mono, ui-monospace, Menlo, monospace" font-size="16">
    <rect x="53" y="530" width="860" height="54" rx="8" fill="#000" opacity="0.08"/>
    <rect x="50" y="526" width="860" height="54" rx="8" fill="#FFFFFF" stroke="#B6B6B6" stroke-width="1.5"/>
