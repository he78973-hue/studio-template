    <use href="#cn-tree-d" transform="translate(692 334)"/>
    <use href="#cn-tree-d" transform="translate(766 334)"/>
    <use href="#cn-tree-d" transform="translate(692 398)"/>
    <use href="#cn-tree-d" transform="translate(766 398)"/>
  </g>

  <!-- L3 主体：补能服务动线（蓝虚线沿道路中线，自首站串联全部站点） -->
  <g id="route">
    <path d="M480 240 V120 H815 V448 H480 V380 V284 H150 V380"
