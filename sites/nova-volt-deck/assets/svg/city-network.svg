    </g>
    <rect x="465" y="220" width="30" height="3" rx="1.5" fill="#FFFFFF" opacity="0.5"/>
    <path d="M483 225 L473 241 L480 241 L477 255 L488 238 L481 238 Z" fill="#FFFFFF"/>
    <!-- 引标：肘形引线 + mono 标注 -->
